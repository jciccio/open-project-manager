# Nginx Reverse Proxy Configuration for Open Project Manager
# Place in /etc/nginx/sites-available/open-project-manager
# and symlink to /etc/nginx/sites-enabled/
#
# Replace 'opm.example.com' with your actual domain or Raspberry Pi IP/hostname.

# Only send "Connection: upgrade" for requests that actually ask to upgrade
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name opm.example.com;

    # Allow attachment uploads up to 50MB (adjust as needed)
    client_max_body_size 50M;

    # nginx drops these in any location that sets its own add_header, so the static location repeats them.
    # HSTS only takes effect once certbot adds HTTPS.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Gzip compression
    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket and persistent connection support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, don't append: the app rate-limits logins by the first X-Forwarded-For entry,
        # which a client could otherwise set to anything.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long-running requests / file uploads
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Static assets caching optimization (optional)
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
}
