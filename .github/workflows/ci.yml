name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./dev.db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"

      - run: yarn install --frozen-lockfile

      - run: npx prisma generate

      - run: npx prisma db push

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint
        continue-on-error: true

      - name: Test
        run: yarn test
        continue-on-error: true
