services:
  open-project-manager:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: open-project-manager
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=file:./dev.db
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in a .env file — generate one with: openssl rand -base64 32}
    volumes:
      - opm_data:/app/dev.db
    restart: unless-stopped

volumes:
  opm_data:
