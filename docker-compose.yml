services:
  open-project-manager:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: open-project-manager
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=file:./dev.db
      - JWT_SECRET=opm-open-project-manager-production-secret-2026
    volumes:
      - opm_data:/app/dev.db
    restart: unless-stopped

volumes:
  opm_data:
